# ExpressNext's build of this fork: test, build, scan, push to GHCR. Runs only on the
# `expressnext` branch, which is upstream plus our own commits (get_post_engagement).
# The cluster (Flux, gh:tomr1233/expressnext-k8s) proposes the newest
# expressnext-<sha7>-<unix-ts> tag as a PR there, and merging that PR is the deploy.
# Upstream's own workflows run on `main` only, so they never fire here.
name: expressnext-image

on:
  push:
    branches: [expressnext]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expressnext-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tomr1233/linkedin-mcp-server
  # Trivy runs from its image, pinned by digest: trivy-action's tags were hijacked in March 2026.
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  # Lint, types, and the suites that cover the page readers and the tool contract. The full
  # suite also holds process and Windows evidence tests that upstream's CI runs on its own
  # matrix; the subset here is what our commits touch.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --group dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: >-
          uv run pytest -q -p no:cacheprovider
          tests/linkedin tests/test_engagement.py tests/test_engagement_script.py
          tests/test_tools.py tests/test_server.py tests/test_rest_api.py

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write     # push to ghcr.io/tomr1233/linkedin-mcp-server with GITHUB_TOKEN; no stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Tag
        id: tag
        run: echo "tag=expressnext-${GITHUB_SHA::7}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build --pull -t "$IMAGE:${{ steps.tag.outputs.tag }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .

      - name: Scan
        run: |
          docker save "$IMAGE:${{ steps.tag.outputs.tag }}" -o image.tar
          docker run --rm -v "$PWD/image.tar:/image.tar:ro" "$TRIVY_IMAGE" image \
            --input /image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress

      - name: Push
        if: github.ref == 'refs/heads/expressnext'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
          echo "Pushed $IMAGE:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
